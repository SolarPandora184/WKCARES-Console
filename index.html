<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dashboard — WKCARES Console</title>
<link rel="manifest" href="manifest.json" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" />
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/components.css" />
<link rel="stylesheet" href="css/pages/dashboard.css" />
</head>
<body>
<div id="app-shell"></div>

<main class="main-content">
  <div class="main-content__inner">

    <div class="dash-header">
      <div>
        <h1 id="welcome-heading">Welcome</h1>
        <div class="dash-header__date" id="current-date"></div>
      </div>
      <div style="text-align:right;">
        <div class="dash-header__clock" id="current-clock"></div>
        <button class="btn btn--primary" id="quick-create-btn" style="margin-top:8px;">
          <span class="material-icons" aria-hidden="true">add</span> Quick create net
        </button>
      </div>
    </div>

    <div class="grid grid--stats card dash-section" id="quick-stats">
      <!-- populated by dashboard.js -->
    </div>

    <div class="dash-grid">
      <div>
        <div class="card dash-section">
          <div class="card__title">Attendance — last 10 nets</div>
          <canvas id="attendance-chart" height="90"></canvas>
        </div>

        <div class="card dash-section">
          <div class="card__title">Recent nets</div>
          <div id="recent-nets-list"></div>
        </div>
      </div>

      <div>
        <div class="card dash-section">
          <div class="card__title">Current net</div>
          <div id="current-net-box" class="empty-state">No net currently in progress.</div>
        </div>

        <div class="card dash-section">
          <div class="card__title">Alerts</div>
          <div id="alerts-list"><div class="empty-state">No open alerts.</div></div>
        </div>

        <div class="card dash-section">
          <div class="card__title">Recent activity</div>
          <div id="activity-list"></div>
        </div>
      </div>
    </div>

  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script type="module" src="js/pages/dashboard.js"></script>
</body>
</html>
