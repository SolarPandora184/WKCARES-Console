<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Reset Password — WKCARES Console</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" />
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/components.css" />
<link rel="stylesheet" href="css/pages/login.css" />
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-card__brand">
      <span class="material-icons" aria-hidden="true">radio</span>
      <span>WKCARES Console</span>
    </div>

    <!-- Shown when arriving without an active session: request a reset email -->
    <div id="request-view">
      <h1>Reset your password</h1>
      <p class="auth-card__subtitle">Enter your email and we'll send you a reset link.</p>
      <div class="auth-card__error" id="request-error" role="alert"></div>
      <form id="request-form" novalidate>
        <div class="field">
          <label for="request-email">Email</label>
          <input type="email" id="request-email" required />
        </div>
        <button type="submit" class="btn btn--primary" style="width:100%; justify-content:center;">Send reset link</button>
      </form>
    </div>

    <!-- Shown when signed in after a forced reset (login.js redirects here with ?forced=1) -->
    <div id="forced-view" style="display:none;">
      <h1>Choose a new password</h1>
      <p class="auth-card__subtitle">An administrator requires you to set a new password before continuing.</p>
      <div class="auth-card__error" id="forced-error" role="alert"></div>
      <form id="forced-form" novalidate>
        <div class="field">
          <label for="new-password">New password</label>
          <input type="password" id="new-password" required />
          <span class="field__hint" id="password-hint"></span>
        </div>
        <button type="submit" class="btn btn--primary" style="width:100%; justify-content:center;">Set password</button>
      </form>
    </div>

    <p class="auth-card__footer"><a href="login.html">Back to sign in</a></p>
  </div>
</div>

<script type="module" src="js/pages/reset-password.js"></script>
</body>
</html>
