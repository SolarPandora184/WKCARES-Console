<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Activate Account — WKCARES Console</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" />
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/components.css" />
<link rel="stylesheet" href="css/pages/login.css" />
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-card__brand">
      <span class="material-icons" aria-hidden="true">radio</span>
      <span>WKCARES Console</span>
    </div>
    <h1>Activate your account</h1>
    <p class="auth-card__subtitle">Enter the activation code from your invitation email, along with the email address it was sent to.</p>

    <div class="auth-card__error" id="error-box" role="alert"></div>

    <form id="activate-form" novalidate>
      <div class="field">
        <label for="code">Activation code</label>
        <input type="text" id="code" name="code" autocomplete="off" maxlength="16" required
               style="text-transform: uppercase; letter-spacing: 0.1em;" />
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="username" required />
      </div>
      <div class="field">
        <label for="password">Create password</label>
        <input type="password" id="password" name="password" autocomplete="new-password" required />
        <span class="field__hint" id="password-hint"></span>
      </div>
      <div class="field">
        <label for="confirm-password">Confirm password</label>
        <input type="password" id="confirm-password" name="confirm-password" autocomplete="new-password" required />
      </div>
      <button type="submit" class="btn btn--primary" style="width:100%; justify-content:center;" id="submit-btn">
        Activate account
      </button>
    </form>

    <p class="auth-card__footer">
      Already activated? <a href="login.html">Sign in</a>
    </p>
  </div>
</div>

<script type="module" src="js/pages/activate.js"></script>
</body>
</html>
