<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Weekly Net Form — WKCARES Console</title>
<link rel="manifest" href="manifest.json" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" />
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/components.css" />
<link rel="stylesheet" href="css/pages/net-form.css" />
</head>
<body>
<div id="app-shell"></div>

<main class="main-content">
  <div class="main-content__inner">

    <div class="form-header">
      <h1>Weekly Net Form</h1>
      <div class="autosave-indicator" id="autosave-indicator">
        <span class="material-icons">cloud_done</span> <span id="autosave-text">All changes saved</span>
      </div>
    </div>

    <!-- Reorderable cards. Level 3 admins control this order and place every
         hand-made script section (see Admin → Script / Form Layout). -->
    <div id="net-form-cards">

    <!-- Net header fields -->
    <div class="card section" data-card-key="header">
      <div class="form-grid-top">
        <div class="field">
          <label for="net-controller">Net Controller</label>
          <input type="text" id="net-controller" />
        </div>
        <div class="field">
          <label for="net-callsign">Callsign</label>
          <input type="text" id="net-callsign" style="text-transform:uppercase;" />
        </div>
        <div class="field">
          <label for="net-date">Date</label>
          <input type="date" id="net-date" />
        </div>
      </div>
      <div class="field">
        <label for="net-comments">Comments</label>
        <textarea id="net-comments" rows="2"></textarea>
      </div>
    </div>

    <!-- Staff check-ins -->
    <div class="card section" data-card-key="staff">
      <div class="section__header">
        <div class="card__title" style="margin-bottom:0;">Staff Check-ins</div>
        <div class="section__total"><span id="staff-total">0</span> present</div>
      </div>
      <div id="staff-table"></div>
    </div>

    <!-- Mountain areas (paired with Staff Comments on the paper form) -->
    <div class="card section" data-card-key="mountain">
      <div class="section__header">
        <div class="card__title" style="margin-bottom:0;">Mountain Areas</div>
        <div class="section__total"><span id="mountain-total">0</span> total</div>
      </div>
      <div id="mountain-table"></div>
    </div>

    <!-- Alternate Bands — (a) per-band summary with a headcount -->
    <div class="card section" data-card-key="bands-summary">
      <div class="section__header">
        <div class="card__title" style="margin-bottom:0;">Alternate Bands — Summary</div>
        <div class="section__total"><span id="bands-total">0</span> check-ins</div>
      </div>
      <div id="bands-summary-table"></div>
    </div>

    <!-- Alternate Bands — (b) individual check-ins, linked to a band above -->
    <div class="card section" data-card-key="bands-individual">
      <div class="section__header">
        <div class="card__title" style="margin-bottom:0;">Alternate Bands — Individual Check-ins</div>
      </div>
      <div id="bands-individual-table"></div>
    </div>

    <!-- Emergency traffic (entry table — the read-aloud prompt is a separate
         hand-made script section; place it before/after this card in
         Admin → Form Layout) -->
    <div class="card section" data-card-key="emergency">
      <div class="section__header">
        <div class="card__title" style="margin-bottom:0;">Emergency Traffic</div>
        <div class="section__total"><span id="emergency-total">0</span> logged</div>
      </div>
      <label class="no-emergency-toggle">
        <input type="checkbox" id="no-emergency" /> No emergency traffic this net
      </label>
      <div id="emergency-table"></div>
    </div>

    <!-- Metro / City area controllers -->
    <div class="card section" data-card-key="metro">
      <div class="section__header">
        <div class="card__title" style="margin-bottom:0;">Metro / City Areas</div>
        <div class="section__total"><span id="metro-total">0</span> total</div>
      </div>
      <div id="metro-table"></div>
    </div>

    <!-- Guest check-ins -->
    <div class="card section" data-card-key="guests">
      <div class="section__header">
        <div class="card__title" style="margin-bottom:0;">Guest Check-ins</div>
        <div class="section__total"><span id="guests-total">0</span> guests</div>
      </div>
      <div id="guests-table"></div>
    </div>

    </div><!-- /#net-form-cards -->

    <div class="grand-total-bar">
      <div>
        <div style="font-size:0.8rem; color:var(--color-text-muted);">Grand total check-ins</div>
        <div class="grand-total-bar__value" id="grand-total">0</div>
      </div>
      <button class="btn btn--primary" id="finalize-btn">
        <span class="material-icons" aria-hidden="true">check_circle</span> Finalize net
      </button>
    </div>

  </div>
</main>

<script type="module" src="js/pages/net-form.js"></script>
</body>
</html>
