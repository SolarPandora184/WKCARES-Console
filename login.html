<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sign In — WKCARES Console</title>
<link rel="manifest" href="manifest.json" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" />
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/components.css" />
<link rel="stylesheet" href="css/pages/login.css" />
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-card__brand">
      <span class="material-icons" aria-hidden="true">radio</span>
      <span>WKCARES Console</span>
    </div>
    <h1>Sign in</h1>
    <p class="auth-card__subtitle">Enter your credentials to access the net management system.</p>

    <div class="auth-card__error" id="error-box" role="alert"></div>

    <form id="login-form" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="username" required />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required />
      </div>
      <button type="submit" class="btn btn--primary" style="width:100%; justify-content:center;" id="submit-btn">
        Sign in
      </button>
    </form>

    <p class="auth-card__footer">
      <a href="reset-password.html">Forgot password?</a> &nbsp;·&nbsp;
      <a href="activate.html">Activate an invitation</a>
    </p>
  </div>
</div>

<script type="module" src="js/pages/login.js"></script>
</body>
</html>
